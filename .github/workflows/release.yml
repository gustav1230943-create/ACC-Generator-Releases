name: Build & Release EXE

# Startet bei jedem Push auf main, der den Quellcode oder die Release-Notizen ändert.
# Die Version kommt aus CURRENT_VERSION in credential_generator.py. Gibt es das Release
# schon, wird nichts gebaut – ein neues Release entsteht also nur, wenn du die Version erhöhst.
on:
  push:
    branches: [main]
    paths:
      - "credential_generator.py"
      - "license_server.py"
      - "release-notes/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $line = Select-String -Path credential_generator.py -Pattern '^CURRENT_VERSION = "(.+)"' | Select-Object -First 1
          $tag = "v" + $line.Matches[0].Groups[1].Value
          "tag=$tag" >> $env:GITHUB_OUTPUT
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "$tag existiert bereits – nichts zu tun." }
          else { "exists=false" >> $env:GITHUB_OUTPUT; Write-Host "Baue $tag" }
          exit 0

      - uses: actions/setup-python@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.ver.outputs.exists == 'false'
        run: python -m pip install --upgrade pip pyinstaller pillow tzdata

      - name: Build EXE
        if: steps.ver.outputs.exists == 'false'
        run: >
          pyinstaller --onefile --noconsole --clean
          --name "Acc.Generator"
          --hidden-import license_server
          --collect-data tzdata
          credential_generator.py

      - name: Create release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ steps.ver.outputs.tag }}"
          $notes = "release-notes/$tag.md"
          if (-not (Test-Path $notes)) { Set-Content $notes "ACC Generator $tag" }
          gh release create $tag "dist/Acc.Generator.exe" --target "${{ github.sha }}" `
            --title "ACC Generator $tag" --notes-file $notes
